---
- name: Lint configs to catch errors
  ansible.builtin.command: /usr/bin/spamassassin --lint
  changed_when: true
  listen: "Restart spamd"

- name: Restart spamd
  ansible.builtin.service:
    name: spamd
    state: restarted
  listen: "Restart spamd"

- name: Restart spamass-milter
  ansible.builtin.service:
    name: spamass-milter
    state: restarted
  listen: "Restart spamass-milter"
